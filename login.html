<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CloudVault</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z'/></svg>">
</head>
<body>

  <!-- Minimal Nav -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
      </div>
      <span>CloudVault</span>
    </a>

    <div class="nav-actions">
      <div id="api-status-badge" class="api-badge sandbox" title="Backend Status">
        <span class="dot"></span> Checking API...
      </div>
      <button id="theme-toggle-btn" class="theme-toggle" title="Toggle Dark/Light Mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <a href="register.html" class="btn btn-secondary btn-sm">Create Account</a>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto; width: 44px; height: 44px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to manage and share your cloud files</p>
      </div>

      <!-- Quick Demo Account Fill -->
      <div class="demo-account-box">
        <span>Quick Demo:</span>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoAccount('demo')">Demo User</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoAccount('admin')">Admin</button>
        </div>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-username">Username or Email</label>
          <input type="text" id="login-username" class="form-control" placeholder="e.g. demo or demo@cloudstorage.io" required>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-footer-actions">
          <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" onclick="showToast('Password reset link is available in full production deployments.', 'info')">Forgot password?</a>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%;">
          Sign In
        </button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="register.html">Sign up for free</a>
      </div>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="dashboard.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: underline;">
          Or bypass login and launch Sandbox Dashboard &rarr;
        </a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkBackendConnectivity();
    });
  </script>
</body>
</html>
