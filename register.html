<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CloudVault</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z'/></svg>">
</head>
<body>

  <!-- Minimal Nav -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
      </div>
      <span>CloudVault</span>
    </a>

    <div class="nav-actions">
      <div id="api-status-badge" class="api-badge sandbox" title="Backend Status">
        <span class="dot"></span> Checking API...
      </div>
      <button id="theme-toggle-btn" class="theme-toggle" title="Toggle Dark/Light Mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
    </div>
  </header>

  <!-- Register Form Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto; width: 44px; height: 44px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
          </svg>
        </div>
        <h1>Create an Account</h1>
        <p>Get 2 GB of instant secure cloud storage quota</p>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-fullname">Full Name</label>
          <input type="text" id="reg-fullname" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-control" placeholder="johndoe" required>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat your password" minlength="6" required>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Create Free Account
        </button>
      </form>

      <div class="auth-switch">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkBackendConnectivity();
    });
  </script>
</body>
</html>
