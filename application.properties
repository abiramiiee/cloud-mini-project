# Server Configuration
server.port=8080
server.servlet.context-path=

# Spring Datasource Configuration (H2 Database)
spring.datasource.url=jdbc:h2:file:./data/cloudstorage;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Custom Cloud Storage Application Configuration
app.upload.dir=./uploads
# 256-bit secret key for HMAC-SHA256 JWT signing
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000

# Base URL used for generating public file share links
app.base-url=http://localhost:8080
